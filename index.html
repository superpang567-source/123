<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阿邦團購</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>🛒 阿邦團購</h1>
            <button id="btnCreate" class="btn-create">＋ 發起接龍</button>
        </header>

        <div id="listView">
            <div id="activityList"></div>
        </div>

        <!-- ===== 詳情頁（表單獨立出來，不會被重新繪製） ===== -->
        <div id="detailView" style="display: none;">
            
            <!-- 返回按鈕和商品資訊（會被更新） -->
            <div id="detailContent">
                <!-- 商品名稱、價格、倒數、統計卡片 -->
            </div>

            <!-- ⭐ 參與表單（獨立出來，永遠不會被重新繪製！） -->
            <div class="participant-form" id="fixedForm">
                <input type="text" id="inputName" placeholder="你的名字" required>
                <input type="text" id="inputAddress" placeholder="社區名稱 + 門牌號碼（如：幸福社區 5號3樓）" required>
                <input type="number" id="inputQty" placeholder="購買數量" value="1" min="1">
                <button class="btn-submit" id="btnJoin">🔥 立即參與</button>
                <div id="savedHint" style="font-size:12px;color:#8a7a6a;text-align:right;margin-top:4px;display:none;">💾 已記住你的資料</div>
            </div>

            <!-- 參與者列表（會被更新） -->
            <div class="participant-list" id="participantSection">
                <div class="list-header">
                    <span>📋 已參與</span>
                    <span>金額</span>
                </div>
                <div id="participantListContainer"></div>
                <div id="summaryRow"></div>
            </div>

        </div>

        <!-- ===== 建立接龍彈窗 ===== -->
        <div id="createModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <h2>🚀 發起新接龍</h2>
                <form id="createForm">
                    <input type="text" id="activityName" placeholder="商品名稱（如：海南芒果）" required>
                    <input type="number" id="activityPrice" placeholder="價格（如：49.9）" step="0.01" required>
                    <input type="datetime-local" id="activityDeadline" required>
                    <textarea id="activityDesc" placeholder="補充說明（選填）"></textarea>
                    <input type="password" id="adminPassword" placeholder="請輸入管理密碼" required>
                    <button type="submit">🚀 立即發佈</button>
                </form>
            </div>
        </div>

        <!-- ===== 刪除確認彈窗 ===== -->
        <div id="deleteModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" id="closeDeleteModal">&times;</span>
                <h2>🗑️ 刪除接龍</h2>
                <p style="color:#6b7a6a;margin-bottom:16px;font-size:15px;line-height:1.7;">
                    確定要刪除「<span id="deleteActivityName" style="color:#ff6b6b;font-weight:700;"></span>」嗎？<br>
                    刪除後所有參與資料將遺失，請輸入管理密碼確認。
                </p>
                <form id="deleteForm">
                    <input type="password" id="deletePassword" placeholder="請輸入管理密碼" required>
                    <div class="delete-error" id="deleteError">❌ 密碼錯誤，請重新輸入</div>
                    <div style="display:flex;gap:10px;">
                        <button type="button" id="cancelDelete" class="btn-cancel">取消</button>
                        <button type="submit" id="confirmDelete" class="btn-danger">確認刪除</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
